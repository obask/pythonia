[package]
name = "pythonia"
version = "0.1.0"
description = "Pythonia - study Python & CS from a local markdown vault"
authors = ["Oleg"]
edition = "2021"

[lib]
name = "pythonia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
dirs = "5"
